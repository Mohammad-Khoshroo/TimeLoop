mapspace:
  constraints:
    - target: acc_reg
      type: datatype
      keep:
        - Z
      bypass:
        - A
        - B

    - target: OA_BUF
      type: datatype
      keep:
        - Z
      bypass:
        - A
        - B

    - target: W_BUF
      type: datatype
      keep:
        - B
      bypass:
        - A
        - Z

    - target: IA_BUF
      type: datatype
      keep:
        - A
      bypass:
        - B
        - Z

    - target: DRAM
      type: datatype
      keep:
        - A
        - B
        - Z

    - target: IA_BUF
      type: spatial
      factors: M1 N4 K1
      permutation: MNK

    - target: acc_reg
      type: spatial
      factors: M1 N1 K4
      permutation: MNK
