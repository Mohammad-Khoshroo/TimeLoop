# ==============================================================================
# قیود نگاشت و جریان داده شتاب‌دهنده MMA (Constraints & Dataflow)
# تعیین جریان داده خروجی-ثابت (Output Stationary) و موازی‌سازی مکانی (Spatial Unrolling)
# ==============================================================================

mapspace:
  constraints:
    # --------------------------------------------------------------------------
    # ۱. تخصیص نوع داده‌ها به سطوح حافظه (Datatype Bypass & Placement)
    # --------------------------------------------------------------------------
    # رجیستر اکومولاتور فقط خروجی‌ها (Z) را نگه می‌دارد و ورودی‌ها و وزن‌ها را عبور می‌دهد
    - target: acc_reg
      type: datatype
      keep:
        - Z
      bypass:
        - A
        - B

    # بافر OA فقط اکتیویشن‌های خروجی محاسبه‌شده را ذخیره می‌کند
    - target: OA_BUF
      type: datatype
      keep:
        - Z
      bypass:
        - A
        - B

    # بافر W فقط وزن‌های مدل شبکه عصبی را ذخیره می‌کند
    - target: W_BUF
      type: datatype
      keep:
        - B
      bypass:
        - A
        - Z

    # بافر IA فقط اکتیویشن‌های ورودی لایه را ذخیره می‌کند
    - target: IA_BUF
      type: datatype
      keep:
        - A
      bypass:
        - B
        - Z

    # حافظه اصلی DRAM کلیه تانسورها را نگه می‌دارد
    - target: DRAM
      type: datatype
      keep:
        - A
        - B
        - Z

    # --------------------------------------------------------------------------
    # ۲. نگاشت مکانی موازی (Spatial Unrolling)
    # --------------------------------------------------------------------------
    # الف) موازی‌سازی ستون‌ها در بعد N در بافر ورودی (IA_BUF به W_BUF):
    # تعداد NUM_COL بلوک‌تری به صورت همزمان ستون‌های مختلف N را پردازش می‌کنند
    - target: IA_BUF
      type: spatial
      factors: M1 N4 K1
      permutation: MNK

    # ب) موازی‌سازی در بعد K درون هر بلوک‌تری (acc_reg به MACs):
    # درون هر بلوک‌تری ۴ ضرب‌کننده روی ۴ درایه مجاور بعد کاهش K ضرب انجام می‌دهند
    - target: acc_reg
      type: spatial
      factors: M1 N1 K4
      permutation: MNK
