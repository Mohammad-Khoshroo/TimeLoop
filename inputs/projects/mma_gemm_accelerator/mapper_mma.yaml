# ==============================================================================
# تنظیمات موتور نگاشت Timeloop برای شتاب‌دهنده MMA
# ==============================================================================

mapper:
  algorithm: hybrid            # ترکیب جستجوی خطی و اکتشاف تصادفی (Random + Linear)
  optimization-metrics:
    - energy                   # بهینه‌سازی توأم انرژی و تاخیر (EDP / Pareto)
    - delay
  num-threads: 4               # استفاده از ۴ ترد موازی CPU
  timeout: 1000                # حداکثر تلاش در صورت عدم بهبود
  victory-condition: 100       # آستانه توقف پس از یافتن ۱۰۰ نگاشت بدون بهبود
  search-size: 2000            # تعداد نگاشت‌های مورد بررسی در هر سناریو
  live-status: false
  
  # لاگ‌برداری از تمامی نگاشت‌های موفق (Optimal و Suboptimal)
  # این پرچم باعث می‌شود تمامی نقاط فضای جستجو در لاگ ثبت شده و قابل استخراج باشند
  log-suboptimal: true
  log-stats: true
  diagnostics: true
