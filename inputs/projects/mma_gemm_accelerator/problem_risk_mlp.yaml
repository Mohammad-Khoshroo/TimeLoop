# ==============================================================================
# مشخصات لایه‌های مدل RiskMLP (مسئله پردازشی شتاب‌دهنده)
# استخراج شده مستقیم از generate_risk_mlp_fused.py برای مدل تخمین ریسک CARLA
# ==============================================================================

# لایه پیش‌فرض: Layer 1
problem:
  shape: gemm-ABZ
  M: 1                         # اندازه دسته (Batch Size = 1 برای استنتاج بلادرنگ خودرو)
  K: 16                        # ابعاد ورودی (Input Features)
  N: 64                        # تعداد نورون‌های خروجی لایه اول (Output Neurons)

# ------------------------------------------------------------------------------
# مشخصات تمام لایه‌های RiskMLP جهت استفاده در اسکریپت DSE:
#
# لایه ۱ (FC1 + ReLU):
#   - ابعاد ورودی: ۱۶
#   - ابعاد خروجی: ۶۴
#   - ابعاد ماتریس: M=1, K=16, N=64
#   - تعداد عملیات MAC: 16 * 64 = 1,024
#
# لایه ۲ (FC2 + ReLU):
#   - ابعاد ورودی: ۶۴
#   - ابعاد خروجی: ۶۴
#   - ابعاد ماتریس: M=1, K=64, N=64
#   - تعداد عملیات MAC: 64 * 64 = 4,096
#
# لایه ۳ (FC3 + Sigmoid):
#   - ابعاد ورودی: ۶۴
#   - ابعاد خروجی: ۳ (احتمال ریسک در ۳ سطح)
#   - ابعاد ماتریس: M=1, K=64, N=3
#   - تعداد عملیات MAC: 64 * 3 = 192
# ------------------------------------------------------------------------------
