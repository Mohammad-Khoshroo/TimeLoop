# Deterministic Evaluation Configuration for GEMM on Spatial MMA Array

arch:
  arithmetic:
    name: MACs
    instances: 16
    meshX: 4
    word-bits: 8

  storage:
    - name: acc_reg
      entries: 1
      instances: 4
      meshX: 4
      word-bits: 32

    - name: OA_BUF
      entries: 64
      instances: 4
      meshX: 4
      word-bits: 32

    - name: W_BUF
      entries: 256
      instances: 4
      meshX: 4
      word-bits: 8

    - name: IA_BUF
      entries: 256
      instances: 1
      word-bits: 8

    - name: DRAM
      technology: DRAM
      instances: 1
      word-bits: 8
      block-size: 16
      bandwidth: 8.0

problem:
  shape: gemm-ABZ
  M: 1
  K: 16
  N: 64

mapping:
  - target: acc_reg
    type: datatype
    keep:
      - Z
    bypass:
      - A
      - B
  - target: OA_BUF
    type: datatype
    keep:
      - Z
    bypass:
      - A
      - B
  - target: W_BUF
    type: datatype
    keep:
      - B
    bypass:
      - A
      - Z
  - target: IA_BUF
    type: datatype
    keep:
      - A
    bypass:
      - B
      - Z
  - target: DRAM
    type: datatype
    keep:
      - A
      - B
      - Z
    bypass:
      []
  - target: acc_reg
    type: spatial
    factors: M1 N1 K4
    permutation: KMN
    split: 0
  - target: acc_reg
    type: temporal
    factors: M1 N1 K4
    permutation: KMN
  - target: OA_BUF
    type: temporal
    factors: M1 N8 K1
    permutation: NMK
  - target: W_BUF
    type: temporal
    factors: M1 N2 K1
    permutation: NMK
  - target: IA_BUF
    type: spatial
    factors: M1 N4 K1
    permutation: NMK
    split: 1
  - target: IA_BUF
    type: temporal
    factors: M1 N1 K1
    permutation: MNK
  - target: DRAM
    type: temporal
    factors: M1 N1 K1
    permutation: MNK
