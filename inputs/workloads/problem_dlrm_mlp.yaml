# ==============================================================================
# مشخصات لایه‌های مدل DLRM-MLP (Meta Recommendation Bottom MLP)
# پرسپترون پایین‌دستی شبکه سیستم‌های پیشنهاددهنده استاندارد DLRM متا
# ==============================================================================

# لایه پیش‌فرض: Layer 1
problem:
  shape: gemm-ABZ
  M: 1                         # اندازه دسته (Batch Size = 1 برای استنتاج بلادرنگ رتبه‌بندی)
  K: 512                       # ابعاد ورودی فشرده ویژگی‌های متراکم
  N: 256                       # نورون‌های لایه اول

# ------------------------------------------------------------------------------
# مشخصات تمام لایه‌های DLRM-MLP:
#
# لایه ۱ (FC1 + ReLU):
#   - ابعاد ورودی: ۵۱۲
#   - ابعاد خروجی: ۲۵۶
#   - ابعاد ماتریس: M=1, K=512, N=256
#   - تعداد عملیات MAC: 512 * 256 = 131,072
#
# لایه ۲ (FC2 + ReLU):
#   - ابعاد ورودی: ۲۵۶
#   - ابعاد خروجی: ۱۲۸
#   - ابعاد ماتریس: M=1, K=256, N=128
#   - تعداد عملیات MAC: 256 * 128 = 32,768
#
# لایه ۳ (FC3 + ReLU):
#   - ابعاد ورودی: ۱۲۸
#   - ابعاد خروجی: ۶۴
#   - ابعاد ماتریس: M=1, K=128, N=64
#   - تعداد عملیات MAC: 128 * 64 = 8,192
# ------------------------------------------------------------------------------
