# ==============================================================================
# مشخصات لایه‌های مدل HAR-MLP (Human Activity Recognition)
# بنچمارک شناسایی فعالیت انسانی از روی داده‌های سنسورهای حرکتی گوشی و ساعت هوشمند
# ==============================================================================

# لایه پیش‌فرض: Layer 1
problem:
  shape: gemm-ABZ
  M: 1                         # اندازه دسته (Batch Size = 1 برای تحلیل آنلاین داده سنسور)
  K: 560                       # ۵۶۰ ویژگی استخراج‌شده زمانی و فرکانسی از سنسورها
  N: 256                       # نورون‌های لایه اول

# ------------------------------------------------------------------------------
# مشخصات تمام لایه‌های HAR-MLP:
#
# لایه ۱ (FC1 + ReLU):
#   - ابعاد ورودی: ۵۶۰
#   - ابعاد خروجی: ۲۵۶
#   - ابعاد ماتریس: M=1, K=560, N=256
#   - تعداد عملیات MAC: 560 * 256 = 143,360
#
# لایه ۲ (FC2 + ReLU):
#   - ابعاد ورودی: ۲۵۶
#   - ابعاد خروجی: ۱۲۸
#   - ابعاد ماتریس: M=1, K=256, N=128
#   - تعداد عملیات MAC: 256 * 128 = 32,768
#
# لایه ۳ (FC3 + Softmax):
#   - ابعاد ورودی: ۱۲۸
#   - ابعاد خروجی: ۱۶ (۶ کلاس فعالیت حرکتی + ۱۰ پدینگ سخت‌افزاری)
#   - ابعاد ماتریس: M=1, K=128, N=16
#   - تعداد عملیات MAC: 128 * 16 = 2,048
# ------------------------------------------------------------------------------
