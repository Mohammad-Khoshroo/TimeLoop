# ==============================================================================
# مشخصات لایه‌های مدل MNIST-MLP (LeNet-300-100 Benchmark)
# مسئله استاندارد شناسایی ارقام دست‌نویس با پرسپترون چندلایه
# ==============================================================================

# لایه پیش‌فرض: Layer 1
problem:
  shape: gemm-ABZ
  M: 1                         # اندازه دسته (Batch Size = 1 برای پردازش بلادرنگ فریم)
  K: 784                       # تصویر ورودی ۲۸ در ۲۸ پیکسل
  N: 256                       # نورون‌های لایه اول (همگام با معماری شتاب‌دهنده)

# ------------------------------------------------------------------------------
# مشخصات تمام لایه‌های MNIST-MLP:
#
# لایه ۱ (FC1 + ReLU):
#   - ابعاد ورودی: ۷۸۴
#   - ابعاد خروجی: ۲۵۶
#   - ابعاد ماتریس: M=1, K=784, N=256
#   - تعداد عملیات MAC: 784 * 256 = 200,704
#
# لایه ۲ (FC2 + ReLU):
#   - ابعاد ورودی: ۲۵۶
#   - ابعاد خروجی: ۱۲۸
#   - ابعاد ماتریس: M=1, K=256, N=128
#   - تعداد عملیات MAC: 256 * 128 = 32,768
#
# لایه ۳ (FC3 + Softmax):
#   - ابعاد ورودی: ۱۲۸
#   - ابعاد خروجی: ۱۶ (۱۰ کلاس رقم + ۶ پدینگ سخت‌افزاری)
#   - ابعاد ماتریس: M=1, K=128, N=16
#   - تعداد عملیات MAC: 128 * 16 = 2,048
# ------------------------------------------------------------------------------
