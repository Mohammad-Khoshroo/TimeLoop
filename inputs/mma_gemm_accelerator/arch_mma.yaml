# ==============================================================================
# معماری شتاب‌دهنده ضرب ماتریس (MMA - Matrix Multiplication Accelerator)
# بر اساس کد RTL واقعی: NVDLA-like Block Tree GEMM Core + Ping-Pong Buffers + DMA
# ==============================================================================

arch:
  # ----------------------------------------------------------------------------
  # ۱. واحدهای محاسباتی (Arithmetic Units / MACs)
  # هر ستون یک Block Tree (BT) است شامل ۴ ضرب‌کننده در بعد K
  # تعداد کل ضرب‌کننده‌ها = NUM_COL × 4
  # دقت: ضرب‌کننده‌های ۸ بیتی INT8
  # ----------------------------------------------------------------------------
  arithmetic:
    name: MACs
    instances: 16             # در حالت پایه: 4 ستون × 4 ضرب‌کننده = 16
    meshX: 4                  # تعداد ستون‌ها (NUM_COL)
    meshY: 4                  # تعداد ضرب‌کننده‌ها در هر ستون (بعد K)
    word-bits: 8              # محاسبات INT8 ورودی و وزن

  storage:
    # --------------------------------------------------------------------------
    # ۲. رجیسترهای اکومولاتور ۳۲ بیتی (acc_reg)
    # هر ستون بلوک‌تری دارای یک رجیستر اکومولاتور ۳۲ بیتی جهت جمع ضرب‌هاست
    # --------------------------------------------------------------------------
    - name: acc_reg
      entries: 1              # ۱ رجیستر ۳۲ بیتی به ازای هر بلوک‌تری
      instances: 4            # NUM_COL ستون
      meshX: 4
      word-bits: 32           # انباشتگر ۳۲ بیتی (Partial Sum Accumulator)
      read-bandwidth: 2
      write-bandwidth: 2

    # --------------------------------------------------------------------------
    # ۳. بافر محلی اکتیویشن‌های خروجی (OA_BUF)
    # خروجی‌های نهایی هر ستون پس از اتمام محاسبه در این بافر پینگ‌پنگی ذخیره می‌شوند
    # سایز پایه در RTL: تعداد ۴ بانک × ۶۴ بایت = ۲۵۶ بایت کل (۶۴ کلمه ۳۲ بیتی)
    # --------------------------------------------------------------------------
    - name: OA_BUF
      entries: 64             # ۶۴ کلمه ۳۲ بیتی (۲۵۶ بایت به ازای هر ستون)
      instances: 4            # NUM_COL بافر محلی اختصاصی ستون‌ها
      meshX: 4
      word-bits: 32           # کلمات خروجی ۳۲ بیتی
      read-bandwidth: 2
      write-bandwidth: 2

    # --------------------------------------------------------------------------
    # ۴. بافر محلی وزن‌ها (W_BUF)
    # هر ستون وزن‌های مربوط به کانال‌های خروجی خود را نگه می‌دارد (پینگ‌پنگ)
    # سایز پایه در RTL: تعداد ۱۶ بانک × ۱۶ بایت = ۲۵۶ بایت کل به ازای هر ستون
    # --------------------------------------------------------------------------
    - name: W_BUF
      entries: 256            # ۲۵۶ بایت کلمات ۸ بیتی
      instances: 4            # NUM_COL بافر محلی اختصاصی ستون‌ها
      meshX: 4
      word-bits: 8            # کلمات ۸ بیتی INT8
      read-bandwidth: 4       # تغذیه ۴ ضرب‌کننده در هر چرخه
      write-bandwidth: 2

    # --------------------------------------------------------------------------
    # ۵. بافر مشترک اکتیویشن ورودی (IA_BUF)
    # این بافر در سطح کل شتاب‌دهنده مشترک است و داده ورودی به تمام ستون‌ها برودکست می‌شود
    # سایز پایه در RTL: تعداد ۴ بانک × ۶۴ بایت = ۲۵۶ بایت کل
    # --------------------------------------------------------------------------
    - name: IA_BUF
      entries: 256            # ۲۵۶ بایت کلمات ۸ بیتی
      instances: 1            # مشترک بین تمام ستون‌ها (Broadcast Bus)
      word-bits: 8
      read-bandwidth: 4       # خواندن ۴ کلمه در چرخه برای بعد K
      write-bandwidth: 4

    # --------------------------------------------------------------------------
    # ۶. حافظه اصلی و گذرگاه اشتراکی (Main Memory / DRAM + SharedBus)
    # حافظه خارجی DRAM متصل شده از طریق گذرگاه اشتراکی ۶۴ بیتی (SharedBus) به DMA اختصاصی
    # --------------------------------------------------------------------------
    - name: DRAM
      technology: DRAM
      instances: 1
      word-bits: 8
      block-size: 16          # واکشی بسته‌ای توسط Dedicated DMA
      bandwidth: 8.0          # پهنای باند گذرگاه اشتراکی: ۸ بایت بر چرخه (۶۴ بیت @ ۵۰۰ مگاهرتز = ۴ گیگابایت بر ثانیه)
